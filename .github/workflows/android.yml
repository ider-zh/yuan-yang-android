name: Android APK
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test and build without release credentials
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          mkdir -p .toolchain
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.5.28/r8-9.5.28.jar -o .toolchain/r8.jar
          echo '38a9ffaaebbd17d1514e3ecbff5a85b989bb13c551b9e224c7409514eea84ff5  .toolchain/r8.jar' | sha256sum --check
          bash tests/check-timeline.sh
          bash tests/check-timelapse-media.sh
          bash tests/check-pose-alignment.sh
          bash fetch-mediapipe.sh
          ANDROID_D8_JAR="$PWD/.toolchain/r8.jar" bash build-apk.sh --preview

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag and prepare trusted dependencies
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          mkdir -p .toolchain
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.5.28/r8-9.5.28.jar -o .toolchain/r8.jar
          echo '38a9ffaaebbd17d1514e3ecbff5a85b989bb13c551b9e224c7409514eea84ff5  .toolchain/r8.jar' | sha256sum --check
          bash fetch-mediapipe.sh
      - name: Sign and verify the formal Android APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          YUANYANG_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          YUANYANG_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          YUANYANG_KEY_ALIAS: yuanyang-release
          YUANYANG_ABIS: arm64-v8a,armeabi-v7a
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/yuanyang-sign.XXXXXXXX")
          trap 'rm -rf -- "$keydir"' EXIT
          export YUANYANG_KEYSTORE="$keydir/release.p12"
          : "${KEYSTORE_B64:?Missing release signing keystore secret}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$YUANYANG_KEYSTORE"
          unset KEYSTORE_B64
          ANDROID_D8_JAR="$PWD/.toolchain/r8.jar" bash build-apk.sh --release
          apk="dist/yuan-yang-${TAG#v}-release.apk"
          test -s "$apk"
          grep -F "versionName='${TAG#v}'" dist/apk-manifest-report-release.txt >/dev/null
          (cd dist && sha256sum --check SHA256SUMS-release)
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=()
          if [[ "$TAG" == v0.7.2 ]]; then draft+=(--draft); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "原样 ${TAG#v}" --generate-notes "${draft[@]}" -- "dist/yuan-yang-${TAG#v}-release.apk" dist/SHA256SUMS-release
