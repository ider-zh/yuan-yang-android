plugins {
    id 'com.android.application'
}

def sourceManifest = new groovy.xml.XmlSlurper().parse(file('src/main/AndroidManifest.xml'))
android {
    namespace sourceManifest.@package.text()
    compileSdk 34

    defaultConfig {
        applicationId sourceManifest.@package.text()
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '0.5.0'
    }

    androidResources {
        noCompress += ["task"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}
